// on the standalone page, opens a small panel. Nothing in that flow moves the camera. A small view bar.
// Never created under ?record or ?film: those render exactly the drawing.
//
//   createExplore({ fig, parts, svg, stage, plate, project, offset, isGrab, grabPart, pauseTour, notify, hint?, subject? })
//     parts     [{ id, title, icon, short, intro, facts, lesson, anchor:[x,y,z], piece, dentK?, match:{names,classes},
//                  zone?, ring?, carry? }]
//     project   world [x, y, z] -> drawing (viewBox) [x, y]
//     offset    (piece, k) -> drawing-unit [dx, dy] the piece has moved by now (plunger travel, Velostat dent)
//     isGrab    element -> true when a press there belongs to the figure's own gesture (it then does not pan)
//     subject   [x, y, w, h] viewBox units: what ?embed=stage keeps in view over the whole press (FILM.stage)
//   returns { actions, act(name, arg), frame(), state(), busy(), key(event), pick(id), announce() }
function createExplore(cfg) {
  const { fig, parts, svg, stage, plate } = cfg;
  const parentWin = window.parent !== window ? window.parent : null;
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const byId = new Map(parts.map((p) => [p.id, p]));
  const ids = parts.map((p) => p.id);
  // ?embed=stage (figures/EMBED.md "Stage mode"): the svg fills the drawing area at any aspect and the home view (zoom 1)
  // is a viewBox of that aspect fitted round the subject (the whole press travel), refitted only when the drawing area
  // changes size. Everywhere else the home view is the authored viewBox.
  const ST = typeof FILM !== "undefined" && FILM.stage && FILM.stage.active ? FILM.stage : null;
  const vb0 = svg.viewBox.baseVal;
  const A = { x: vb0.x, y: vb0.y, w: vb0.width, h: vb0.height };     // the authored viewBox (the silhouette mask's frame)
  let B = { ...A };                                                  // the home view
  let centre0 = { x: B.x + B.w / 2, y: B.y + B.h / 2 };
  const S = cfg.subject ? { x: cfg.subject[0], y: cfg.subject[1], w: cfg.subject[2], h: cfg.subject[3] } : { ...A };
  const PAD = 0.07;            // stage: the subject spans 86 % of the limiting dimension at rest
  const MINZ = 1;
  const MAXZ = 4;
  const STEP = 1.5;
  const DRAG = 4;
  const FLOAT = 4;             // px on screen: how far a hovered part rises
  const GAP = 18;              // px between the subject's drawn edge and a label in the side room
  const EDGE = 10;             // px: a label keeps this far inside the drawing area
  const LEAD = 16;             // px: the shortest leader
  const DOT = 3;               // px: the leader's terminal dot (radius)
  let view = { zoom: 1, cx: centre0.x, cy: centre0.y };
  let picked = null;
  let hovered = null;          // the pointer's part
  let focused = null;          // the keyboard's part (a focused part button)
  let hot = null;              // what shows the hover look: hovered, else focused
  let dragging = false;
  let anim = 0;
  let dirty = true;
  let lastKey = "";

  svg.classList.add("ft-explore");
  stage.classList.add("ft-explore");

  // ------------------------------------------------------------ which drawn items belong to which part
  const groups = [...svg.querySelectorAll("[data-name], [data-part]")];
  const nameOf = (g) => g.dataset.name || g.dataset.part || "";
  function partOfName(name) {
    let best = null;
    let len = -1;
    for (const p of parts) for (const n of p.match.names || []) if ((name === n || name.startsWith(n)) && n.length > len) (best = p), (len = n.length);
    return best;
  }
  const elsOf = new Map(parts.map((p) => [p.id, []]));
  for (const g of groups) {
    const p = partOfName(nameOf(g));
    if (!p) continue;
    // only the outermost group of a part (never mark a group inside one that is already marked)
    const outer = g.parentElement && g.parentElement.closest("[data-name], [data-part]");
    if (outer && partOfName(nameOf(outer)) === p) continue;
    elsOf.get(p.id).push(g);
    g.classList.add("ft-part");
  }
  const classParts = parts.filter((p) => (p.match.classes || []).length);
  // ft-on = picked, ft-hov = hovered or focused (the hover look), ft-kf = focused from the keyboard (the focus ring).
  // A class-matched part (the current's dashes) gets the matching class on the svg instead.
  const SVG_CLS = { "ft-on": "ft-hl", "ft-hov": "ft-hv", "ft-kf": "ft-kf" };
  function mark(id, cls, on) {
    if (!id) return;
    for (const g of elsOf.get(id) || []) g.classList.toggle(cls, on);
    if (byId.get(id)?.match.classes?.length) svg.classList.toggle(`${SVG_CLS[cls]}-${id}`, on);
  }

  // ------------------------------------------------------------ geometry: drawing units <-> overlay px <-> client px
  const vbNow = () => {
    const w = B.w / view.zoom;
    const h = B.h / view.zoom;
    return { x: view.cx - w / 2, y: view.cy - h / 2, w, h };
  };
  let R = null;  // cached rects
  function rects() {
    const p = plate.getBoundingClientRect();
    const s = svg.getBoundingClientRect();
    const st = stage.getBoundingClientRect();
    const k = plate.offsetWidth ? p.width / plate.offsetWidth : 1;   // CSS zoom (?embed=fit) or transforms
    R = { p, s, st, k, ow: plate.offsetWidth, oh: plate.offsetHeight };
    return R;
  }
  // drawing units -> client px inside the svg box: the scale and the letterbox offsets of xMidYMid meet. Outside stage
  // mode the svg always has the viewBox's aspect: s.width / vb.w and no offsets.
  const meet = (vb, r = R || rects()) => {
    if (!ST) return { sc: r.s.width / vb.w, ox: 0, oy: 0 };
    const sc = Math.min(r.s.width / vb.w, r.s.height / vb.h) || 1;
    return { sc, ox: (r.s.width - vb.w * sc) / 2, oy: (r.s.height - vb.h * sc) / 2 };
  };
  // drawing units -> overlay px is one scale and one offset: X = ax + u * sc, Y = ay + v * sc
  const affine = (vb = vbNow(), r = R || rects()) => {
    const m = meet(vb, r);
    const sc = m.sc / r.k;
    return { sc, ax: (r.s.left - r.p.left + m.ox) / r.k - vb.x * sc, ay: (r.s.top - r.p.top + m.oy) / r.k - vb.y * sc };
  };
  const toOverlay = (u, vb = vbNow()) => {
    const a = affine(vb);
    return [a.ax + u[0] * a.sc, a.ay + u[1] * a.sc];
  };
  const fromOverlay = (ox, oy, vb, r = R || rects()) => {
    const a = affine(vb, r);
    return [(ox - a.ax) / a.sc, (oy - a.ay) / a.sc];
  };
  const clientToUnits = (cx, cy) => {
    const r = rects();
    const vb = vbNow();
    if (!ST) return [vb.x + ((cx - r.s.left) * vb.w) / r.s.width, vb.y + ((cy - r.s.top) * vb.h) / r.s.height];
    const m = meet(vb, r);
    return [vb.x + (cx - r.s.left - m.ox) / m.sc, vb.y + (cy - r.s.top - m.oy) / m.sc];
  };
  // the view of zoom z whose drawing point u sits at client (px, py)
  const viewKeeping = (zoom, u, px, py) => {
    const r = R || rects();
    const w = B.w / zoom;
    const h = B.h / zoom;
    if (!ST) {
      const fx = (px - r.s.left) / r.s.width;
      const fy = (py - r.s.top) / r.s.height;
      return { zoom, cx: u[0] - fx * w + w / 2, cy: u[1] - fy * h + h / 2 };
    }
    const m = meet({ x: 0, y: 0, w, h }, r);
    return { zoom, cx: u[0] - (px - r.s.left - m.ox) / m.sc + w / 2, cy: u[1] - (py - r.s.top - m.oy) / m.sc + h / 2 };
  };
  // the visible drawing window in overlay px (the svg box, clipped by the plate)
  function visibleBox() {
    const r = R || rects();
    const x0 = Math.max(r.s.left, r.p.left) - r.p.left;
    const y0 = Math.max(r.s.top, r.p.top) - r.p.top;
    const x1 = Math.min(r.s.right, r.p.right) - r.p.left;
    const y1 = Math.min(r.s.bottom, r.p.bottom) - r.p.top;
    return { x0: x0 / r.k, y0: y0 / r.k, x1: x1 / r.k, y1: y1 / r.k };
  }
  const anchorUnits = (p) => {
    const a = cfg.project(p.anchor);
    const d = cfg.offset(p.piece, p.dentK ?? 1);
    return [a[0] + d[0], a[1] + d[1]];
  };
  // zones: screen hull of a world box, in drawing units (the taxel: a spot inside other parts)
  function hull(points) {
    const pts = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const p of pts) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop(); lower.push(p); }
    const upper = [];
    for (const p of pts.reverse()) { while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop(); upper.push(p); }
    return lower.slice(0, -1).concat(upper.slice(0, -1));
  }
  const zoneOf = new Map(parts.filter((p) => p.zone).map((p) => {
    const [[x0, y0, z0], [x1, y1, z1]] = p.zone;
    const corners = [];
    for (const x of [x0, x1]) for (const y of [y0, y1]) for (const z of [z0, z1]) corners.push(cfg.project([x, y, z]));
    return [p.id, hull(corners)];
  }));
  const zones = [...zoneOf].map(([id, poly]) => ({ p: byId.get(id), poly }));
  const inPoly = (pt, poly) => {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i];
      const [xj, yj] = poly[j];
      if (yi > pt[1] !== yj > pt[1] && pt[0] < ((xj - xi) * (pt[1] - yi)) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  };

  // ------------------------------------------------------------ hit test: what part is drawn at a client point
  function hitAt(cx, cy) {
    const u = clientToUnits(cx, cy);
    const zone = zones.find((z) => inPoly(u, z.poly));
    for (const el of document.elementsFromPoint(cx, cy)) {
      if (el === svg || !svg.contains(el)) continue;
      if (el.classList.contains("iso-halo")) continue;
      if (zone) return zone.p;
      for (const p of classParts) if (p.match.classes.some((c) => el.closest("." + c))) return p;
      const g = el.closest("[data-name], [data-part]");
      return g ? partOfName(nameOf(g)) : null;
    }
    return null;
  }

  // ------------------------------------------------------------ overlay DOM
  const ICONS = {
    layers: "M12 3 3 8l9 5 9-5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5",
    chip: "M7 7h10v10H7zM10 4v3M14 4v3M10 17v3M14 17v3M4 10h3M4 14h3M17 10h3M17 14h3",
    plug: "M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4",
    ruler: "M3 15 15 3l6 6L9 21zM7 11l2 2M10 8l2 2M13 5l2 2M5 14l1.5 1.5",
    bolt: "M13 3 5 13h6l-1 8 8-10h-6z",
    wave: "M2 12h3l2-6 3 12 3-9 2 5 2-2h5",
    grid: "M4 4h16v16H4zM4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16",
    touch: "M9 11V5.5a1.5 1.5 0 0 1 3 0V11M12 10V8.5a1.5 1.5 0 0 1 3 0V11M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.5-2.1L4 16a1.5 1.5 0 0 1 2.3-1.9L9 16",
    cable: "M4 4h6v6H4zM7 10v4a4 4 0 0 0 4 4h3M14 15h6v6h-6z",
    board: "M3 6h18v12H3zM7 10h4v4H7zM14 10h3M14 13h3M6 6V4M10 6V4M14 6V4M18 6V4",
    resistor: "M2 12h4l1.5-4 3 8 3-8 3 8 1.5-4h4",
    usb: "M12 3v14M12 3l-2 3h4zM12 13l-4-3V8M12 15l4-3v-2M8 8h0M16 10h0M12 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4z",
    gauge: "M4 17a8 8 0 1 1 16 0M12 17l4-6M7.5 13.5l-1-1M12 9V8M16.5 13.5l1-1",
    film: "M3 8l9-4 9 4-9 4zM3 8v3l9 4 9-4V8M7 9.8l.01 0M12 8l.01 0M16 9.6l.01 0",
    gold: "M4 6h16M4 12h16M4 18h16M8 3v18M16 3v18",
  };
  // icons are CSS masks (an SVG as a data URI) so the overlay adds no drawn SVG next to the figure's own
  const maskOf = (d, extra = "") => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='${d}'/>${extra}</svg>`)}")`;
  const iconSvg = (name) => `<i class="ft-i" aria-hidden="true" style="--i:${maskOf(ICONS[name] || ICONS.chip).replace(/"/g, "&quot;")}"></i>`;
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  // short card text never breaks inside a number range, a product or a value and its unit ("0–1023", "0.6 × 0.6 mm",
  // "5 V", "10 kΩ")
  const tidy = (t) => String(t)
    .replace(/(\d)–(\d)/g, "$1\u2060–\u2060$2")
    .replace(/(\d) ×(?= \d)/g, "$1\u00a0×")
    .replace(/× (\d)/g, "×\u00a0$1")
    .replace(/(\d) (?=(?:k?Ω|mm|V|ms|Hz)\b|k?Ω)/g, "$1\u00a0");

  const ov = document.createElement("div");
  ov.className = "ft-ov";
  ov.innerHTML = `<svg class="ft-leaders" aria-hidden="true"><g data-rings></g><g data-leads></g></svg>`;
  plate.append(ov);
  const leadG = ov.querySelector("[data-leads]");
  const ringG = ov.querySelector("[data-rings]");
  // Keyboard: one Tab stop for all the parts (roving tabindex). The buttons are invisible; the focused part shows a
  // focus ring on the part itself (full teal outline and a crisp teal halo round its silhouette, which reads without
  // the float, so also under reduced motion) plus the hover float, and its title in the hint corner. Enter or Space
  // picks it.
  const keysBox = document.createElement("div");
  keysBox.className = "ft-keys";
  keysBox.setAttribute("role", "group");
  keysBox.setAttribute("aria-label", "Parts of the drawing (arrow keys move between them, Enter labels one)");
  ov.append(keysBox);
  const dots = new Map();
  let rover = parts[0]?.id ?? null;
  parts.forEach((p) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ft-hotspot";
    b.dataset.id = p.id;
    b.tabIndex = p.id === rover ? 0 : -1;
    b.setAttribute("aria-label", `${p.title}: ${p.short}`);
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      cfg.pauseTour();
      pick(p.id, "user");
    });
    b.addEventListener("focus", () => {
      setRover(p.id);
      mark(focused, "ft-kf", false);
      focused = p.id;
      mark(focused, "ft-kf", true);
      refreshHot();
      dirty = true;
      frame();
    });
    b.addEventListener("blur", () => {
      if (focused === p.id) (mark(focused, "ft-kf", false), (focused = null));
      refreshHot();
      dirty = true;
      frame();
    });
    b.addEventListener("keydown", (e) => {
      const i = ids.indexOf(p.id);
      const to = e.key === "ArrowRight" || e.key === "ArrowDown" ? ids[(i + 1) % ids.length] : e.key === "ArrowLeft" || e.key === "ArrowUp" ? ids[(i - 1 + ids.length) % ids.length] : e.key === "Home" ? ids[0] : e.key === "End" ? ids[ids.length - 1] : null;
      if (!to) return;
      e.preventDefault();
      setRover(to);
      dots.get(to).focus({ preventScroll: true });
    });
    keysBox.append(b);
    dots.set(p.id, b);
  });
  function setRover(id) {
    if (id === rover) return;
    if (rover) dots.get(rover).tabIndex = -1;
    rover = id;
    dots.get(rover).tabIndex = 0;
  }
  // the one label: icon, TITLE, the short line and a "Details ›" link-style button under it
  const label = document.createElement("div");
  label.className = "ft-label";
  label.hidden = true;
  label.setAttribute("role", "group");
  label.innerHTML = `<span class="ft-ico"></span><span class="ft-lt"><b></b><span class="ft-ct"></span><button type="button" class="ft-more">Details<span aria-hidden="true"> ›</span></button></span>`;
  const moreBtn = label.querySelector(".ft-more");
  moreBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    details();
  });
  ov.append(label);
  const live = document.createElement("span");
  live.className = "ft-sr";
  live.setAttribute("aria-live", "polite");
  ov.append(live);
  const bar = document.createElement("div");
  bar.className = "ft-viewbar";
  bar.setAttribute("role", "toolbar");
  bar.setAttribute("aria-label", "View");
  const barIcon = (d, extra) => `<i class="ft-i" aria-hidden="true" style="--i:${maskOf(d, extra).replace(/"/g, "&quot;")}"></i>`;
  bar.innerHTML =
    `<button type="button" data-v="out" aria-label="Zoom out" title="Zoom out">${barIcon("M5 12h14")}</button>` +
    `<button type="button" data-v="in" aria-label="Zoom in" title="Zoom in">${barIcon("M5 12h14M12 5v14")}</button><span class="ft-sep"></span>` +
    `<button type="button" data-v="reset" aria-label="Fit the drawing" title="Fit (double-click the drawing)">${barIcon("M12 4v3M12 17v3M4 12h3M17 12h3M12 8.5l1.6 3.5L12 15.5 10.4 12z", "<circle cx='12' cy='12' r='8'/>")}</button>`;
  bar.addEventListener("click", (e) => {
    const v = e.target.closest("button")?.dataset.v;
    if (v) viewCmd(v);
  });
  ov.append(bar);
  // standalone page only (no website to show it): the small details panel "Details ›" opens
  const insp = parentWin ? null : document.createElement("div");
  if (insp) {
    insp.className = "ft-inspector";
    insp.hidden = true;
    insp.tabIndex = -1;
    insp.setAttribute("role", "dialog");
    insp.addEventListener("click", (e) => { if (e.target.closest(".ft-x")) closeDetails(true); });
    ov.append(insp);
  }
  ov.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    e.stopPropagation();
    if (insp && !insp.hidden) return closeDetails(true);
    const back = picked && label.contains(document.activeElement) ? picked : null;
    pick(null, "user");
    if (back) dots.get(back).focus({ preventScroll: true });
  });
  // the hint corner shows the hovered (or focused) part's name
  const hint = plate.querySelector('[data-corner="hint"]');
  const readoutEl = plate.querySelector('[data-corner="readout"]');
  const hint0 = cfg.hint ?? (hint ? hint.textContent : "");
  if (hint) hint.textContent = hint0;
  // the first of the texts that does not run into the readout on the same row (a narrow card has less room)
  function setHint(...texts) {
    if (!hint) return;
    for (const t of texts) {
      hint.textContent = t;
      if (!readoutEl) return;
      const a = hint.getBoundingClientRect();
      const b = readoutEl.getBoundingClientRect();
      if (a.bottom <= b.top || b.bottom <= a.top || a.right + 12 <= b.left) return;
    }
    hint.textContent = hint0;
  }

  // ------------------------------------------------------------ view (pan / zoom) = the svg viewBox
  const clampView = (v) => {
    const zoom = Math.min(MAXZ, Math.max(MINZ, v.zoom));
    // the view centre stays over the drawing, so some of it is always on screen (stage: over the subject, whose box
    // is the drawing; the home view is wider than it on a wide stage)
    if (ST) return { zoom, cx: Math.min(Math.max(S.x + S.w, centre0.x), Math.max(Math.min(S.x, centre0.x), v.cx)), cy: Math.min(Math.max(S.y + S.h, centre0.y), Math.max(Math.min(S.y, centre0.y), v.cy)) };
    return { zoom, cx: Math.min(B.x + B.w, Math.max(B.x, v.cx)), cy: Math.min(B.y + B.h, Math.max(B.y, v.cy)) };
  };
  const atRest = (v = view) => Math.abs(v.zoom - 1) < 1e-3 && Math.abs(v.cx - centre0.x) < 0.05 && Math.abs(v.cy - centre0.y) < 0.05;
  // stage: CSS px per drawing unit of the home view, against the 650 px card's (about 1)
  const homeScale = () => (ST ? Math.max(1, meet(B).sc / ((R || rects()).k || 1)) : 1);
  function applyView() {
    const vb = vbNow();
    const rest = atRest();
    if (rest) svg.setAttribute("viewBox", ST ? `${B.x.toFixed(3)} ${B.y.toFixed(3)} ${B.w.toFixed(3)} ${B.h.toFixed(3)}` : `${B.x} ${B.y} ${B.w} ${B.h}`);
    else svg.setAttribute("viewBox", `${vb.x.toFixed(3)} ${vb.y.toFixed(3)} ${vb.w.toFixed(3)} ${vb.h.toFixed(3)}`);
    svg.classList.toggle("ft-viewed", !rest);
    stage.classList.toggle("ft-viewed", !rest);
    // lines thicken a little as you zoom in, so the drawing keeps its weight (stage: also as the home view grows)
    const grow = view.zoom * homeScale();
    if (rest && grow < 1 + 1e-3) svg.style.removeProperty("--anatomy-weight");
    else svg.style.setProperty("--anatomy-weight", `${(0.6 * Math.sqrt(grow)).toFixed(3)}px`);
    setFloat();
    syncBar();
    dirty = true;
    frame();
    cfg.notify();
  }
  // a hovered part rises FLOAT px on screen whatever the zoom: the CSS translate is in drawing units
  let floatUnits = "";
  function setFloat() {
    const r = R || rects();
    const sc = meet(vbNow(), r).sc;
    const u = sc > 0 ? `${(FLOAT / sc).toFixed(3)}px` : "";
    if (u === floatUnits) return;
    floatUnits = u;
    if (u) svg.style.setProperty("--ft-float", u);
  }
  // stage: the home view, a viewBox of the drawing area's aspect round the subject (which already holds the whole
  // press travel). It is refitted only when the drawing area changes size: picking, labels and details never move it.
  // The view keeps its zoom and its offset from home; a view at home stays at home.
  function fitHome() {
    if (!ST) return;
    const size = ST.size();
    if (!(size.w > 1 && size.h > 1)) return;
    const vb = ST.fitViewBox(S, { pad: PAD, size });
    const same = Math.abs(vb.x - B.x) < 1e-3 && Math.abs(vb.y - B.y) < 1e-3 && Math.abs(vb.w - B.w) < 1e-3 && Math.abs(vb.h - B.h) < 1e-3;
    if (same) return;
    const home = atRest();
    const off = { x: view.cx - centre0.x, y: view.cy - centre0.y };
    B = vb;
    centre0 = { x: B.x + B.w / 2, y: B.y + B.h / 2 };
    cancelAnimationFrame(anim);
    anim = 0;
    target = null;
    view = home ? { zoom: 1, cx: centre0.x, cy: centre0.y } : clampView({ zoom: view.zoom, cx: centre0.x + off.x, cy: centre0.y + off.y });
    rects();
    placeBar();
    applyView();
  }
  // stage: the view bar sits bottom-centre on the drawing area. On a short stage that is the base plate's front edge,
  // so it slides sideways to the nearest spot clear of the drawing (the silhouette mask, in the home view). Decided
  // here, once per fit, so the bar never wanders while you zoom or pan.
  function placeBar() {
    barDx = 0;
    if (!mask) buildMask();
    if (!mask) return;
    const r = rects();
    const vis = visibleBox();
    const bw = bar.offsetWidth || 104;
    const bh = bar.offsetHeight || 32;
    const y = (r.st.bottom - r.p.top) / r.k - bh - 6;
    const c = ((r.st.left + r.st.right) / 2 - r.p.left) / r.k;
    const on = (dx) => {
      const [ux0, uy0] = fromOverlay(c + dx - bw / 2 - 6, y - 6, B, r);
      const [ux1, uy1] = fromOverlay(c + dx + bw / 2 + 6, y + bh + 6, B, r);
      return coverage(mask.subj, ux0, uy0, ux1, uy1) + coverage(mask.base, ux0, uy0, ux1, uy1);
    };
    if (on(0) < 0.004) return;
    const most = (vis.x1 - vis.x0) / 2 - bw / 2 - 8;
    for (let dx = 12; dx <= most; dx += 12) {
      for (const sx of [-dx, dx]) if (on(sx) < 0.004) return void (barDx = sx);
    }
  }
  function syncBar() {
    bar.querySelector('[data-v="in"]').disabled = view.zoom >= MAXZ - 1e-3;
    bar.querySelector('[data-v="out"]').disabled = view.zoom <= MINZ + 1e-3;
    bar.querySelector('[data-v="reset"]').disabled = atRest();
  }
  let target = null;            // where a running view animation is heading
  let barDx = 0;                // stage: the view bar's sideways slide off the drawing (placeBar)
  function setView(v, { animate = false } = {}) {
    const to = clampView(v);
    cancelAnimationFrame(anim);
    anim = 0;
    target = null;
    if (!animate || still.matches) {
      view = to;
      applyView();
      return;
    }
    const from = { ...view };
    target = to;
    const t0 = performance.now();
    const T = 240;
    const step = (now) => {
      const t = Math.min(1, (now - t0) / T);
      const e = 1 - Math.pow(1 - t, 3);
      // zoom eases on a log scale so in and out feel the same
      view = { zoom: Math.exp(Math.log(from.zoom) + (Math.log(to.zoom) - Math.log(from.zoom)) * e), cx: from.cx + (to.cx - from.cx) * e, cy: from.cy + (to.cy - from.cy) * e };
      applyView();
      if (t < 1) anim = requestAnimationFrame(step);
      else { anim = 0; target = null; }
    };
    anim = requestAnimationFrame(step);
  }
  // zoom to z keeping the drawing point under client (px, py) where it is
  function zoomAt(z, px, py, opts) {
    const zoom = Math.min(MAXZ, Math.max(MINZ, z));
    const u = clientToUnits(px, py);
    setView(viewKeeping(zoom, u, px, py), opts);
  }
  function viewCmd(cmd) {
    if (cmd === "reset") return setView({ zoom: 1, cx: centre0.x, cy: centre0.y }, { animate: true });
    // { zoom, x, y }: the same shape ft:state reports (x, y = the view centre's offset from the resting centre, viewBox px)
    if (cmd && typeof cmd === "object") {
      const zoom = Number(cmd.zoom ?? view.zoom);
      if (!(zoom > 0)) throw new Error("view: { zoom } must be a number > 0");
      cfg.pauseTour();
      return setView({ zoom, cx: centre0.x + Number(cmd.x || 0), cy: centre0.y + Number(cmd.y || 0) }, { animate: true });
    }
    if (cmd !== "in" && cmd !== "out") throw new Error(`view: arg must be 'in', 'out', 'reset' or { zoom, x, y } (got ${JSON.stringify(cmd)})`);
    cfg.pauseTour();
    const r = rects();
    // zoom toward the picked part if it is on screen, else toward the middle of the drawing window
    const vis = visibleBox();
    let px = r.p.left + ((vis.x0 + vis.x1) / 2) * r.k;
    let py = r.p.top + ((vis.y0 + vis.y1) / 2) * r.k;
    if (picked) {
      const [ox, oy] = toOverlay(anchorUnits(byId.get(picked)));
      if (ox > vis.x0 && ox < vis.x1 && oy > vis.y0 && oy < vis.y1) (px = r.p.left + ox * r.k), (py = r.p.top + oy * r.k);
    }
    // a second step while the first is still easing goes on from where the first is heading
    if (target) {
      const z = target.zoom * (cmd === "in" ? STEP : 1 / STEP);
      return setView({ zoom: z, cx: target.cx, cy: target.cy }, { animate: true });
    }
    zoomAt(view.zoom * (cmd === "in" ? STEP : 1 / STEP), px, py, { animate: true });
  }

  // ------------------------------------------------------------ hover (pointer) / focus (keyboard): float + outline
  // A part floats only by a CSS `translate` on its own groups (plus the parts it carries, `carry` in parts.mjs), so
  // the plunger's own transform attribute, the layout and every other part stay as they are. The picked part never
  // floats (its label's leader is pinned to it), and nothing floats under reduced motion or during a press. A part
  // with `float: false` (the press: the base plate everything else stands on) shows the outline and glow only.
  let floating = [];
  function floatOn(id) {
    for (const g of floating) g.classList.remove("ft-float");
    floating = [];
    if (!id || id === picked || still.matches || pressing) return;
    const p = byId.get(id);
    if (p.float === false) return;
    for (const pid of [id, ...(p.carry || [])]) {
      if (pid !== id && pid === picked) continue;
      for (const g of elsOf.get(pid) || []) (g.classList.add("ft-float"), floating.push(g));
    }
  }
  let pressing = false;
  function refreshHot() {
    const id = hovered ?? focused;
    if (id !== hot) {
      mark(hot, "ft-hov", false);
      hot = id;
      mark(hot, "ft-hov", true);
      dirty = true;
      frame();
    }
    floatOn(hot);
    setHint(hot ? byId.get(hot).title : hint0);
  }
  function hover(id) {
    if (id === hovered) return;
    hovered = id;
    refreshHot();
  }

  // ------------------------------------------------------------ pick: one label for the picked part
  const summary = (p) => ({ id: p.id, title: p.title, icon: p.icon, short: p.short, lesson: p.lesson });
  const full = (p) => ({ ...summary(p), intro: p.intro, facts: p.facts.map((f) => ({ ...f })) });
  const post = (msg) => { if (parentWin) try { parentWin.postMessage(msg, "*"); } catch {} };
  function pick(id, how = "user") {
    if (id !== null && id !== undefined && !byId.has(id)) throw new Error(`pick: unknown part "${id}" (have ${ids.join(", ")})`);
    const next = id ?? null;
    if (next === picked) {
      if (how === "act") post({ type: "ft:pick", fig, part: next ? full(byId.get(next)) : null });
      return;
    }
    mark(picked, "ft-on", false);
    if (picked) dots.get(picked).setAttribute("aria-pressed", "false");
    picked = next;
    if (picked) {
      const p = byId.get(picked);
      mark(picked, "ft-on", true);
      dots.get(picked).setAttribute("aria-pressed", "true");
      setRover(picked);
      cfg.pauseTour();
      label.setAttribute("aria-label", p.title);
      label.querySelector(".ft-ico").innerHTML = iconSvg(p.icon);
      label.querySelector("b").textContent = tidy(p.title);
      label.querySelector(".ft-ct").textContent = tidy(p.short);
      moreBtn.setAttribute("aria-label", `Details: ${p.title}`);
      live.textContent = `${p.title}. ${p.short}`;
    } else live.textContent = "";
    floatOn(hot);
    spot = null;
    labelKey = "";
    labelIn();
    if (insp && !insp.hidden) {
      if (picked) fillDetails(byId.get(picked));
      else closeDetails(false);
    }
    post({ type: "ft:pick", fig, part: picked ? full(byId.get(picked)) : null });
    dirty = true;
    frame();
    cfg.notify();
  }
  // a new label fades in (no slide: it must not look like the drawing moved)
  function labelIn() {
    label.classList.remove("ft-in");
    leadG.classList.remove("ft-in");
    if (!picked || still.matches) return;
    void label.offsetWidth;
    label.classList.add("ft-in");
    leadG.classList.add("ft-in");
  }
  // "Details ›": the website shows its floating details window (ft:details); the standalone page opens its own panel
  function details() {
    const p = picked && byId.get(picked);
    if (!p) return;
    cfg.pauseTour();
    if (parentWin) return void post({ type: "ft:details", fig, part: full(p) });
    fillDetails(p);
    insp.hidden = false;
    placeInspector();
    insp.querySelector(".ft-x")?.focus({ preventScroll: true });
    cfg.notify();
  }
  function fillDetails(p) {
    insp.setAttribute("aria-label", p.title);
    insp.innerHTML = `<header><span class="ft-ico">${iconSvg(p.icon)}</span><b>${esc(p.title)}</b><button type="button" class="ft-x" aria-label="Close">×</button></header>` +
      `<p>${esc(tidy(p.intro))}</p><dl>${p.facts.map((f) => `<dt>${esc(f.label)}</dt><dd title="${esc(f.src)}">${esc(tidy(f.value))}${f.badge ? `<span class="ft-badge">${esc(f.badge)}</span>` : ""}</dd>`).join("")}</dl>` +
      (p.lesson ? `<div class="ft-lesson">Taught in lesson ${p.lesson}</div>` : "");
    placeInspector();
  }
  function closeDetails(refocus) {
    if (!insp || insp.hidden) return;
    const had = insp.contains(document.activeElement);
    insp.hidden = true;
    if ((refocus || had) && !label.hidden) moreBtn.focus({ preventScroll: true });
    cfg.notify();
  }
  // standalone page: the panel goes beside the card when the window has room, else into the corner of the card that
  // covers the least of the drawing (the silhouette mask), off the picked part and off its label
  function placeInspector() {
    if (!insp || insp.hidden) return;
    const r = rects();
    const iw = insp.offsetWidth;
    const ih = insp.offsetHeight;
    const W = r.ow;
    const H = r.oh;
    let pos = null;
    if (innerWidth - r.p.right >= (iw + 24) * r.k) pos = { x: W + 12, y: 34 };
    else if (r.p.left >= (iw + 24) * r.k) pos = { x: -iw - 12, y: 34 };
    else {
      if (!mask) buildMask();
      const vb = vbNow();
      const units = (ox, oy) => fromOverlay(ox, oy, vb, r);
      const bb = barRect();
      let pb = null;
      for (const g of (picked && elsOf.get(picked)) || []) {
        const q = g.getBoundingClientRect();
        if (!q.width) continue;
        const x0 = (q.left - r.p.left) / r.k, y0 = (q.top - r.p.top) / r.k, x1 = (q.right - r.p.left) / r.k, y1 = (q.bottom - r.p.top) / r.k;
        pb = pb ? { x0: Math.min(pb.x0, x0), y0: Math.min(pb.y0, y0), x1: Math.max(pb.x1, x1), y1: Math.max(pb.y1, y1) } : { x0, y0, x1, y1 };
      }
      const lb = spot ? { x0: spot.x, y0: spot.y, x1: spot.x + spot.w, y1: spot.y + spot.h } : null;
      let best = Infinity;
      for (const [x, y] of [[12, 34], [W - 12 - iw, 34], [12, H - 34 - ih], [W - 12 - iw, H - 34 - ih]]) {
        const [ux0, uy0] = units(x, y);
        const [ux1, uy1] = units(x + iw, y + ih);
        let cost = mask ? 34 * coverage(mask.subj, ux0, uy0, ux1, uy1) + 7 * coverage(mask.base, ux0, uy0, ux1, uy1) : 0;
        for (const [b, w] of [[pb, 80], [lb, 60]]) {
          if (!b) continue;
          const ix = Math.max(0, Math.min(x + iw, b.x1) - Math.max(x, b.x0));
          const iy = Math.max(0, Math.min(y + ih, b.y1) - Math.max(y, b.y0));
          cost += (w * ix * iy) / Math.max(1, (b.x1 - b.x0) * (b.y1 - b.y0));
        }
        if (bb && x < bb.x + bb.w + 6 && x + iw + 6 > bb.x && y < bb.y + bb.h + 6 && y + ih + 6 > bb.y) cost += 20;
        if (cost < best - 0.3) (best = cost), (pos = { x, y });
      }
    }
    insp.style.right = "auto";
    insp.style.left = `${pos.x.toFixed(0)}px`;
    insp.style.top = `${Math.max(34, pos.y).toFixed(0)}px`;
  }

  // ------------------------------------------------------------ the part's outline profile (for the label's anchor)
  // The picked part's silhouette is rasterised once per pose and zoom into a canvas in overlay px: its solids' fills,
  // its loose lines (spring, dashes) and circles, through their transform attributes (the plunger's travel) but never
  // the hover float. Per row: the leftmost and rightmost drawn x. A pan only shifts it.
  const shapeCache = new Map();     // element -> { d, path }
  function shapesOf(p) {
    const fills = [];
    const strokes = [];
    if (zoneOf.has(p.id)) return { fills, strokes, zone: zoneOf.get(p.id) };
    const roots = elsOf.get(p.id) || [];
    const add = (el) => {
      if (el.closest(".iso-halo") || el.closest("text")) return;
      const tag = el.tagName.toLowerCase();
      if (tag === "circle") return void fills.push(el);
      if (tag !== "path") return;
      // a solid's fill and its outline are its silhouette; a loose line (the spring, the dashes, a trace) counts by
      // its stroke. Strokes are drawn at their real width: every kit line is a non-scaling stroke in CSS px, and the
      // picked part's outline is 2.4x thicker, so the label's dot lands on the edge the reader sees
      if (el.classList.contains("iso-fill")) fills.push(el);
      else if (!el.closest(".iso-solid") || el.classList.contains("iso-edge")) strokes.push(el);
    };
    for (const g of roots) for (const el of g.querySelectorAll("path, circle")) add(el);
    for (const c of p.match.classes || []) for (const el of svg.querySelectorAll("." + c)) add(el);
    return { fills, strokes, zone: null };
  }
  const pathOf = (el) => {
    const d = el.tagName.toLowerCase() === "circle" ? `circle:${el.getAttribute("cx")},${el.getAttribute("cy")},${el.getAttribute("r")}` : el.getAttribute("d") || "";
    const c = shapeCache.get(el);
    if (c && c.d === d) return c.path;
    let path;
    if (d.startsWith("circle:")) {
      const [cx, cy, r] = d.slice(7).split(",").map(Number);
      path = new Path2D();
      path.arc(cx, cy, r, 0, Math.PI * 2);
    } else path = new Path2D(d);
    shapeCache.set(el, { d, path });
    return path;
  };
  // the element's transform attributes up to the svg (attribute lists only: a CSS translate, the float, is ignored)
  const matrixOf = (el) => {
    let m = new DOMMatrix();
    for (let n = el; n && n !== svg; n = n.parentNode) {
      const list = n.transform && n.transform.baseVal;
      if (!list || !list.numberOfItems) continue;
      let t = new DOMMatrix();
      for (let i = 0; i < list.numberOfItems; i++) {
        const q = list.getItem(i).matrix;
        t = t.multiply(new DOMMatrix([q.a, q.b, q.c, q.d, q.e, q.f]));
      }
      m = t.multiply(m);
    }
    return m;
  };
  let prof = null;      // { id, sc, pose, ax, ay, x0, y0, n, L, Rt }
  const poseOf = (p) => cfg.offset(p.piece, p.dentK ?? 1).map((v) => v.toFixed(2)).join(",") + (p.id === picked ? "|on" : "");
  function profileOf(p, a) {
    const pose = poseOf(p);
    if (prof && prof.id === p.id && Math.abs(prof.sc - a.sc) < 1e-9 && prof.pose === pose) {
      // a pan: the same raster, shifted, as long as it still reaches past the window on every side it was cut at
      const dx = a.ax - prof.ax;
      const dy = a.ay - prof.ay;
      const v = visibleBox();
      const c = prof.cut;
      const ok = (!c.l || prof.x0 + dx <= v.x0 - 10) && (!c.t || prof.y0 + dy <= v.y0 - 10) && (!c.r || prof.x1 + dx >= v.x1 + 10) && (!c.b || prof.y0 + prof.n + dy >= v.y1 + 10);
      if (ok) return { ...prof, x0: prof.x0 + dx, y0: prof.y0 + dy, ax: a.ax, ay: a.ay };
    }
    const sh = shapesOf(p);
    // the part's box in drawing units (fills, strokes or zone), then in overlay px, kept inside the drawing window
    let ux0 = Infinity, uy0 = Infinity, ux1 = -Infinity, uy1 = -Infinity;
    const grow = (x, y) => { ux0 = Math.min(ux0, x); uy0 = Math.min(uy0, y); ux1 = Math.max(ux1, x); uy1 = Math.max(uy1, y); };
    const off = cfg.offset(p.piece, p.dentK ?? 1);
    // a spot part (the taxel) is drawn by its ring: the label points at the ring's outer edge
    let ring = null;
    if (sh.zone && p.ring) {
      const c = cfg.project(p.ring.at);
      const rad = Math.max(p.ring.min ?? 17, (p.ring.r ?? 11) * a.sc) / a.sc;
      ring = [c[0] + off[0], c[1] + off[1], rad];
      grow(ring[0] - rad, ring[1] - rad);
      grow(ring[0] + rad, ring[1] + rad);
    } else if (sh.zone) for (const [x, y] of sh.zone) grow(x + off[0], y + off[1]);
    for (const el of [...sh.fills, ...sh.strokes]) {
      let bb;
      try { bb = el.getBBox(); } catch { continue; }
      const m = matrixOf(el);
      for (const [x, y] of [[bb.x, bb.y], [bb.x + bb.width, bb.y], [bb.x, bb.y + bb.height], [bb.x + bb.width, bb.y + bb.height]]) {
        const q = m.transformPoint(new DOMPoint(x, y));
        grow(q.x, q.y);
      }
    }
    if (!(ux1 > ux0)) return null;
    const vis = visibleBox();
    const M = 3;
    // (cut to the window and 120 px round it: a zoomed-in part can be many times the window's size)
    const fx0 = Math.floor(a.ax + ux0 * a.sc) - M, fy0 = Math.floor(a.ay + uy0 * a.sc) - M;
    const fx1 = Math.ceil(a.ax + ux1 * a.sc) + M, fy1 = Math.ceil(a.ay + uy1 * a.sc) + M;
    const ox0 = Math.max(Math.floor(vis.x0) - 120, fx0);
    const oy0 = Math.max(Math.floor(vis.y0) - 120, fy0);
    const ox1 = Math.min(Math.ceil(vis.x1) + 120, fx1);
    const oy1 = Math.min(Math.ceil(vis.y1) + 120, fy1);
    const cut = { l: ox0 > fx0, t: oy0 > fy0, r: ox1 < fx1, b: oy1 < fy1 };
    const w = Math.min(4096, ox1 - ox0);
    const h = Math.min(4096, oy1 - oy0);
    if (!(w > 0 && h > 0)) return null;
    const cv = document.createElement("canvas");
    cv.width = w;
    cv.height = h;
    const ctx = cv.getContext("2d", { willReadFrequently: true });
    if (!ctx) return null;
    const base = new DOMMatrix([a.sc, 0, 0, a.sc, a.ax - ox0, a.ay - oy0]);
    ctx.fillStyle = "#000";
    ctx.strokeStyle = "#000";
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    if (ring) {
      ctx.setTransform(base);
      ctx.beginPath();
      ctx.arc(ring[0], ring[1], ring[2], 0, Math.PI * 2);
      ctx.fill();
    } else if (sh.zone) {
      ctx.setTransform(base);
      ctx.beginPath();
      sh.zone.forEach(([x, y], i) => (i ? ctx.lineTo(x + off[0], y + off[1]) : ctx.moveTo(x + off[0], y + off[1])));
      ctx.closePath();
      ctx.fill();
    }
    for (const el of sh.fills) {
      ctx.setTransform(base.multiply(matrixOf(el)));
      ctx.fill(pathOf(el));
    }
    const widthOf = new Map();       // computed stroke width (px) per class list: one style read per kind of line
    for (const el of sh.strokes) {
      const k = el.getAttribute("class") || "";
      if (!widthOf.has(k)) {
        const cs = getComputedStyle(el);
        widthOf.set(k, cs.stroke === "none" || cs.visibility === "hidden" ? 0 : parseFloat(cs.strokeWidth) || 0);
      }
      const px = widthOf.get(k);
      if (!(px > 0)) continue;
      ctx.setTransform(base.multiply(matrixOf(el)));
      ctx.lineWidth = px / a.sc;
      ctx.stroke(pathOf(el));
    }
    const px = ctx.getImageData(0, 0, w, h).data;
    const L = new Float32Array(h).fill(NaN);
    const Rt = new Float32Array(h).fill(NaN);
    const ON = 96;
    for (let y = 0; y < h; y++) {
      const row = y * w * 4 + 3;
      for (let x = 0; x < w; x++) {
        const al = px[row + x * 4];
        if (al >= ON) { L[y] = x + 1 - al / 255; break; }
      }
      if (Number.isNaN(L[y])) continue;
      for (let x = w - 1; x >= 0; x--) {
        const al = px[row + x * 4];
        if (al >= ON) { Rt[y] = x + al / 255; break; }
      }
    }
    prof = { id: p.id, sc: a.sc, pose, ax: a.ax, ay: a.ay, x0: ox0, y0: oy0, x1: ox0 + w, n: h, L, Rt, cut };
    return prof;
  }

  // ------------------------------------------------------------ label placement
  // The label goes on the side nearest the part, in the side room beside the subject (the room the stage fit leaves),
  // or, when that room is too narrow, over the drawing area on that side as far out as it goes. It is centred on the
  // part's outermost point on that side (leftmost for a label on the left, rightmost on the right) and one straight
  // horizontal leader runs from the label's inner edge to that point, which carries a small dot. A label never covers
  // the picked part: when it would at the outermost point (or the view bar is there), it moves along the part's outer
  // edge to the nearest row where it fits, keeping its leader horizontal. It is placed again only when the part, the
  // view or the size moves the anchor by more than 0.5 px.
  let spot = null;        // { side, x, y, w, h, ly, dot:[x, y] } in overlay px
  let labelKey = "";
  let sizeOf = null;      // the label's measured size (per pick and window width)
  function measureLabel() {
    const key = `${picked}|${innerWidth}|${(R || rects()).k.toFixed(4)}`;
    if (sizeOf && sizeOf.key === key) return sizeOf;
    const was = label.hidden;
    label.style.visibility = "hidden";
    label.hidden = false;
    fitTitle();
    sizeOf = { key, w: label.offsetWidth, h: label.offsetHeight };
    label.hidden = was;

const kOhm = (r) => (r >= 9950 ? `${Math.round(r / 1e3)} kΩ` : `${(r / 1e3).toFixed(1)} kΩ`);
const readoutOf = (m) => `R_taxel ${kOhm(m.r)} (illustrative) · V_A0 ${m.dv.vA0.toFixed(2)} V · ADC ${m.code} · byte ${m.byte}`;
const nearestStop = (r) => STOPS.reduce((best, s, i) => (Math.abs(Math.log(s / r)) < Math.abs(Math.log(STOPS[best] / r)) ? i : best), 0);

// ---------------------------------------------------------------- motion state
const RAMP = 0.3;           // holding: the plunger goes from touching to a hard press in about 3 s
const S0 = () => ({ x: 0, v: 0, goal: 0, holding: false, touring: false, tourT: 0, idle: 0, flow: 0, stop: 0 });
let s = S0();
let autoTour = !FILM.record && !still.matches;   // ?embed: off for good once the website or the reader takes over
const TOUR = [[0, 0], [1.2, 0], [1.3, depthOfStop(2)], [3.6, depthOfStop(2)], [3.7, depthOfStop(5)], [5.6, depthOfStop(5)], [5.7, 0], [9, 0]];
const tourGoal = (t) => {
  const tt = t % TOUR[TOUR.length - 1][0];
  let goal = 0;
  for (const [at, value] of TOUR) if (tt >= at) goal = value;
  return goal;
};

function update(dt) {
  const calm = still.matches;
  if (s.touring) {
    s.tourT += dt;
    s.goal = tourGoal(s.tourT);
  } else if (EX && EX.busy()) {
    s.idle = Math.min(s.idle, -2.2);            // explore mode: no tour while a part is picked, the view is moved or a drag is on
  } else if (autoTour && !s.holding && s.goal === 0 && Math.abs(s.x) < 1e-3) {
    s.idle += dt;
    if (s.idle > 1.4) (s.touring = true), (s.tourT = 0);
  }
  if (s.holding) s.goal = Math.min(1, Math.max(s.goal, D.contact * 0.6) + RAMP * dt);
  if (calm) {
    s.x = s.goal;
    s.v = 0;
  } else {
    // pressing: critically damped (no overshoot past the press you asked for); letting go: the return spring bounces once
    const back = s.goal < s.x && !s.holding;
    const w = back ? 11 : 7;
    const zeta = back ? 0.5 : 1;
    const n = 4;
    const h = dt / n;
    for (let i = 0; i < n; i++) {
      s.v += (w * w * (s.goal - s.x) - 2 * zeta * w * s.v) * h;
      s.x += s.v * h;
    }
    if (Math.abs(s.goal - s.x) < 1e-5 && Math.abs(s.v) < 1e-4) (s.x = s.goal), (s.v = 0);
    // dashes travel in proportion to the loop current
    s.flow -= DATA.flow.pxPerAmp * SH_DV.current(modelAt(s.x).r) * dt;
    if (s.flow < -1e4) s.flow += DATA.flow.dash * 2000;
  }
}

// ---------------------------------------------------------------- drawing
const ys = g.STRIP_PROFILE_Y;
const dipOf = (dent) => (y) => dent * GEO.smooth(g.PY - g.TIP_R - 12, g.PY - g.TIP_R, y);
const pxDelta = (dz) => {
  const a = iso([0, 0, 0], P);
  const b = iso([0, 0, dz], P);
  return [b[0] - a[0], b[1] - a[1]];
};
let drawn = null;
let lastCode = -1;
let curPose = { drop: 0, dent: 0 };
let lastText = "";
function draw() {
  const m = modelAt(s.x);
  const pose = m.pose;
  if (drawn === null || Math.abs(pose.depth - drawn) > 1e-6) {
    drawn = pose.depth;
    curPose = { drop: pose.drop, dent: pose.dent };
    const dz = -pose.drop;
    const t = translateAlong(P, [0, 0, dz]);
    const off = pxDelta(dz);
    for (const el of movers) {
      if (Math.abs(dz) < 1e-6) el.removeAttribute("transform");
      else el.setAttribute("transform", t);
      holdStill(el, Math.abs(dz) < 1e-6 ? [0, 0] : off);
    }
    const dip = dipOf(pose.dent);
    // the Velostat band under the strip: its top dents with the strip, so the copper rests on it
    const vel = GEO.prismPaths(GEO.XF, GEO.slabYZ(ys, g.zVel[0], g.zVel[1], dip), g.BAND[0], g.BAND[1]);
    dyn.vel.innerHTML = solidSvg(vel, { tone: "mid", className: "ft-m-velostat" });
    const strip = GEO.prismPaths(GEO.XF, GEO.bandYZ(ys, g.zTop[0], g.FPC_T, dip), g.stX[0], g.stX[1]);
    // the sense line's dashes start at the cut (the crossing) and run back along the strip, under the tip
    const topLine = ys.map((y) => [g.PX, y, g.zTop[1] - dip(y)]);
    dyn.strip.innerHTML = solidSvg(strip, { tone: "mid", className: "ft-m-fpc" }) +
      lineSvg(pathOf([iso([g.stX[0], g.FRONT, g.zTop[1] - dip(g.FRONT)], P), iso([g.stX[1], g.FRONT, g.zTop[1] - dip(g.FRONT)], P)]), { tone: "mid" }) + `<path class="iso-line cr-flow" data-tone="lit" d="${pathOf(topLine.map((p) => iso(p, P)))}"/>`;
    const copper = GEO.prismPaths(GEO.XF, GEO.bandYZ(ys, g.zCuT[0], g.CU_T, dip), g.cuX[0], g.cuX[1]);
    dyn.copper.innerHTML = solidSvg(copper, { tone: "hi", lit: true, className: "ft-m-gold" });
    const ease = 1 - (1 - pose.p) * (1 - pose.p);
    dyn.tip.innerHTML = solidSvg(cylinder(g.PX, g.PY, g.TIP_R * (1 + 0.07 * ease), pose.tipBottom, pose.tipH, P, 32), { tone: "lo", className: "ft-m-rubber" });
    const coil = GEO.helix(g.PX, g.PY, g.SPRING_R, g.BUSH_TOP + 0.2, g.KNOB_Z + dz - 0.2, g.SPRING_TURNS, 0.5);
    springBack.setAttribute("d", coil.back);
    springFront.setAttribute("d", coil.front);
    velFlow.setAttribute("d", [-1.6, 0, 1.6].map((dx) => pathOf([iso([g.PX + dx, g.FRONT, g.cuBMid], P), iso([g.PX + dx, g.FRONT, g.zVel[1] - pose.dent], P)])).join(""));
    stage.setAttribute("aria-valuenow", pose.depth.toFixed(3));
  }
  svg.style.setProperty("--cr-flow", s.flow.toFixed(2));
  if (m.code !== lastCode) {
    lastCode = m.code;
    const seg = GEO.sevenSeg(m.code, DATA.dig);
    segOn.setAttribute("d", seg.on);
    segOff.setAttribute("d", seg.off);
  }
  const text = readoutOf(m);
  if (text !== lastText) {
    lastText = text;
    readout.textContent = text;
  }
  if (EX) EX.frame();
}
function describe() {
  const m = modelAt(s.goal);
  const word = s.goal <= 0 ? "Not pressed" : m.pose.p <= 0 ? "Tip touching" : `Pressed ${Math.round(m.pose.p * 100)} percent`;
  const text = `${word}. ${readoutOf(m)}`;
  stage.setAttribute("aria-valuetext", text);
  if (status) status.textContent = text;
}

// ---------------------------------------------------------------- live loop (not in record mode)
let frame = 0;
let last = 0;
let visible = false;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const n = Math.max(1, Math.ceil(dt * 120 - 1e-9));
  for (let i = 0; i < n; i++) update(dt / n);
  draw();
  FILM.notify();
  const resting = still.matches && !s.holding && s.x === s.goal;
  frame = visible && !resting ? requestAnimationFrame(tick) : 0;
}
const run = () => {
  if (FILM.record) return;
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};
const takeOver = () => {
  s.touring = false;
  s.idle = -2.2;            // resume the tour only after about 3.6 s of quiet
};
// explore mode (pan, zoom, pick): stop a running tour and lift what it left pressed
const pauseTour = () => {
  if (s.touring) {
    s.touring = false;
    s.holding = false;
    s.goal = 0;
    s.stop = 0;
    describe();
  }
  s.idle = Math.min(s.idle, -2.2);
  run();
};
const press = (down) => {
  takeOver();
  if (down) {
    s.holding = true;
    s.goal = Math.max(s.goal, s.x);
  } else {
    s.holding = false;
    s.goal = 0;
    s.stop = 0;
  }
  describe();
  run();
};
const stepStop = (to) => {
  takeOver();
  s.holding = false;
  s.stop = Math.max(0, Math.min(STOPS.length - 1, to));
  s.goal = depthOfStop(s.stop);
  describe();
  run();
};
if (!FILM.record) {
  new IntersectionObserver((entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  }, { rootMargin: "120px 0px" }).observe(stage);
  stage.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    if (EX && !isGrab(event.target)) return;   // explore mode: anywhere else a drag pans and a click picks
    try {
      stage.setPointerCapture(event.pointerId);
    } catch {}
    press(true);
  });
  const up = () => s.holding && press(false);
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", up);
  stage.addEventListener("lostpointercapture", up);
  stage.addEventListener("keydown", (event) => {
    if (EX && EX.key(event)) {
      event.preventDefault();
      return;
    }
    const here = () => (s.holding || s.touring ? nearestStop(modelAt(s.x).r) : s.stop);
    if (event.key === " " || event.key === "Enter") {
      event.preventDefault();
      if (!event.repeat) press(true);
    } else if (event.key === "ArrowRight" || event.key === "ArrowUp") {
      event.preventDefault();
      stepStop(here() + (event.shiftKey ? 3 : 1));
    } else if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
      event.preventDefault();
      stepStop(here() - (event.shiftKey ? 3 : 1));
    } else if (event.key === "Home") {
      event.preventDefault();
      stepStop(0);
    } else if (event.key === "End") {
      event.preventDefault();
      stepStop(STOPS.length - 1);
    } else if (event.key === "Escape") {
      press(false);
    }
  });
  stage.addEventListener("keyup", (event) => {
    if (event.key === " " || event.key === "Enter") press(false);
  });
  stage.addEventListener("focus", describe);
}

// ---------------------------------------------------------------- explore mode (live page and ?embed; never ?record / ?film)
function isGrab(el) {
  return !!(el && el.closest && el.closest('[data-name^="plunger."], [data-part^="spring-"]'));
}
const EX = FILM.record || FILM.film ? null : createExplore({
  fig: "crossing",
  parts: DATA.parts,
  svg,
  stage,
  plate,
  project: (p) => iso(p, P),
  offset(piece, k) {
    if (piece === "plunger") return pxDelta(-curPose.drop);
    if (piece === "dent") return pxDelta(-curPose.dent * k);
    return [0, 0];
  },
  isGrab,
  grabPart: "plunger",
  pauseTour: () => pauseTour(),
  notify: () => FILM.notify(),
  hint: DATA.hintExplore,
  subject: DATA.subject,
});
if (EX) stage.setAttribute("aria-label", DATA.ariaExplore);

// ---------------------------------------------------------------- film contract (record mode only)
FILM.install({
  fig: "crossing",
  // ?embed: the website sends the same actions; they run through the live loop (run), not step()
  embed: {
    wake: run,
    keys: stage,
    after: describe,
    quiet(clean) {
      // the tour was interrupted (a website action, a click, a pan, a key): lift what it left pressed.
      // A following press(true) on the knob still works: it starts from goal = max(goal, x).
      if (s.touring) (s.goal = 0), (s.holding = false), (s.stop = 0);
      autoTour = false;
      s.touring = false;
    },
  },
  actions: ["press", "release", "hold", "stop", "tour", ...(EX ? EX.actions : [])],
  reset() {
    s = S0();
    drawn = null;
    lastCode = -1;
  },
  act(name, arg) {
    if (EX && EX.actions.includes(name)) return EX.act(name, arg);
    s.touring = false;
    if (name === "press") {
      if (arg === undefined || arg === null) {
        s.holding = true;                       // like holding the pointer down: the plunger keeps going down
        s.goal = Math.max(s.goal, s.x);
      } else {
        s.holding = false;
        s.goal = depthOfPress(Number(arg));      // arg = press 0..1 (0 = tip just touching, 1 = hard)
      }
    } else if (name === "release") {
      s.holding = false;
      s.goal = 0;
    } else if (name === "hold") {
      s.holding = false;                        // stay exactly where the plunger is now
      s.goal = s.x;
      s.v = 0;
    } else if (name === "stop") {
      // arg: { index } (0..6 into R_STOPS), { ohms }, a bare integer 0..6 (index) or any other number (ohms)
      const o = arg !== null && typeof arg === "object" ? arg : Number.isInteger(Number(arg)) && Number(arg) >= 0 && Number(arg) < STOPS.length ? { index: Number(arg) } : { ohms: Number(arg) };
      if (o.index !== undefined) {
        s.stop = Math.max(0, Math.min(STOPS.length - 1, Math.round(Number(o.index))));
        s.goal = depthOfStop(s.stop);
      } else {
        const ohms = Number(o.ohms);
        if (!(ohms > 0)) throw new Error("__film.act('stop'): need { index } or { ohms } > 0");
        const i = STOPS.indexOf(ohms);
        s.goal = i >= 0 ? depthOfStop(i) : ohms >= STOPS[0] ? 0 : depthOfPress(SH_T.pressFromR(ohms));
      }
      s.holding = false;
    } else if (name === "tour") {
      s.touring = true;
      s.tourT = 0;
    }
  },
  update,
  draw,
  maxDt: 1 / 120,
  state() {
    const m = modelAt(s.x);
    return {
      depth: +s.x.toFixed(5),
      goal: +s.goal.toFixed(5),
      press: +m.pose.p.toFixed(5),
      touching: m.pose.approach >= 1,
      rTaxel: Math.round(m.r),
      vA0: +m.dv.vA0.toFixed(4),
      current: +m.dv.current.toExponential(4),     // amperes
      currentA: +m.dv.current.toExponential(4),
      adc: m.code,
      byte: m.byte,
      illustrative: SH_T.ILLUSTRATIVE,
      readout: readout.textContent,
      ...(EX ? EX.state() : {}),
    };
  },
});
draw();
describe();
// ?embed: announce the clickable parts once the bridge has said ft:ready (both are queued behind install)
if (EX && FILM.embed) setTimeout(() => EX.announce(), 0);
</script></body></html>
