# Build Learn FlexiTac and publish it with GitHub Pages (Settings → Pages → Source: GitHub Actions).
# The figures are committed pre-built in learn-flexitac/public/figures, so the build needs only the site and
# flexitac-anatomy/shared (the `@shared` alias in vite.config.ts).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learn-flexitac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: learn-flexitac/package-lock.json
      - run: npm ci
      # `npm run build` would first re-sync the figures from flexitac-anatomy/figures, which is not in this repo;
      # the synced copies in public/figures are committed instead.
      - run: npx tsc --noEmit
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: learn-flexitac/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
